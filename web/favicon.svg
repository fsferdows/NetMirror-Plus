<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Radial Atmosphere Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0e172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </radialGradient>

    <!-- Card Edge Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b47"/>
      <stop offset="40%" stop-color="#e50914"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Center Crimson Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e3d"/>
      <stop offset="100%" stop-color="#b30610"/>
    </linearGradient>

    <!-- Letter M Chrome Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Stream Cyan Pulse -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ambientGlow)" stroke="url(#cardBorder)" stroke-width="10" filter="url(#cardShadow)"/>

  <!-- Inner Crimson Badge -->
  <rect x="76" y="76" width="360" height="360" rx="84" fill="url(#emblemGrad)" stroke="rgba(255,255,255,0.22)" stroke-width="4"/>

  <!-- Subtle Emblem Inner Shadow & Gradient Shine -->
  <path d="M 76 160 C 76 113.6 113.6 76 160 76 L 352 76 C 398.4 76 436 113.6 436 160 L 436 210 Q 256 160 76 210 Z" fill="rgba(255, 255, 255, 0.15)"/>

  <!-- Bold Modern 'M' Cinema Monogram -->
  <!-- Left Pillar -->
  <rect x="136" y="148" width="52" height="216" rx="14" fill="url(#letterGrad)" filter="url(#glowEffect)"/>
  
  <!-- Right Pillar -->
  <rect x="324" y="148" width="52" height="216" rx="14" fill="url(#letterGrad)" filter="url(#glowEffect)"/>

  <!-- Center V Chiseled Chevron -->
  <path d="M 136 156 L 256 312 L 376 156 L 340 156 L 256 264 L 172 156 Z" fill="url(#letterGrad)"/>

  <!-- Cinema Play Triangle Embedded In Heart of M -->
  <polygon points="240,210 286,236 240,262" fill="#0b1120" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="244,216 280,236 244,256" fill="url(#streamGrad)"/>

  <!-- Electric Cyan '.stream' Pulse Dot Beacon (Top-Right) -->
  <circle cx="396" cy="116" r="32" fill="#040711" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
  <circle cx="396" cy="116" r="24" fill="url(#streamGrad)" filter="url(#cyanGlow)"/>
  <!-- Broadcast Wave Pulse Rings -->
  <path d="M 374 94 A 32 32 0 0 1 418 94" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <circle cx="396" cy="116" r="8" fill="#ffffff"/>
</svg>

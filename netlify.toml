# ==============================================================================
# NetMirror Plus - Netlify Configuration
# ==============================================================================

[build]
  publish = "web"
  functions = "netlify/functions"
  command = "echo 'NetMirror Plus build ready'"

# Cache headers for static assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Direct all API requests to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single Page Application router fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
